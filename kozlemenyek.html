<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Közlemények - Bethlen István Kör</title>
    <!-- Favicon -->
     <link rel="icon" type="image/png" href="testicon.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; }
        body { padding-top: 140px; } 
        @media (max-width: 768px) { body { padding-top: 180px; } }
    </style>
</head>
<body class="bg-white text-gray-900 flex flex-col min-h-screen">
    
    <!-- Intelligens Fejléc -->
    <div id="fejlec" class="fixed top-0 left-0 right-0 z-50 shadow-md transition-transform duration-300">
        <div class="bg-red-600 text-white text-center py-2 px-4 text-xs md:text-sm font-bold tracking-wide">
            ⚠️ Ez a weboldal fejlesztés alatt áll, az itt szereplő információk csak tesztjellegűek!
        </div>
        <nav class="p-6 flex flex-col md:flex-row justify-between items-center gap-4 border-b border-gray-200 bg-white">
            <a href="/" class="flex items-center space-x-3 opacity-90 hover:opacity-100 transition duration-300">
                <img src="/logo2.png" alt="Logó" class="h-10 w-auto">
            </a>
            <div class="flex flex-wrap justify-center gap-6">
                <a href="/" class="text-gray-600 hover:text-[#1b3223] font-semibold transition-all duration-300 hover:scale-105">Főoldal</a>
                <a href="/kozlemenyek" class="text-[#1b3223] font-bold border-b-2 border-[#1b3223] transition-all duration-300">Közlemények</a>
                <a href="/esemenyek" class="text-gray-600 hover:text-[#1b3223] font-semibold transition-all duration-300 hover:scale-105">Események</a>
                <a href="/kapcsolat" class="text-gray-600 hover:text-[#1b3223] font-semibold transition-all duration-300 hover:scale-105">Kapcsolat</a>
            </div>
        </nav>
    </div>

    <!-- Tartalom -->
    <main class="py-8 px-6 max-w-5xl mx-auto flex-grow w-full">
        <h1 class="text-4xl font-bold text-[#1b3223] mb-8 border-b-2 border-[#1b3223] pb-2">Összes Közlemény</h1>
        <div id="osszes-kozlemeny" class="space-y-6">
            <p class="text-gray-500 italic">Közlemények betöltése...</p>
        </div>
    </main>

    <!-- Lábjegyzet -->
    <footer class="bg-[#1b3223] text-white py-8 text-center text-sm mt-auto">
        <p>&copy; 2026 Bethlen István Kör. Minden jog fenntartva.</p>
    </footer>

    <script>
        let utolsoGorgetes = 0;
        const fejlec = document.getElementById('fejlec');

        window.addEventListener('scroll', () => {
            let aktualisGorgetes = window.pageYOffset;
            if (aktualisGorgetes > utolsoGorgetes && aktualisGorgetes > 100) {
                fejlec.classList.add('-translate-y-full');
            } else {
                fejlec.classList.remove('-translate-y-full');
            }
            utolsoGorgetes = aktualisGorgetes;
        });

        function parseMarkdownFile(raw) {
            const match = raw.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/);
            let meta = {};
            let body = raw;
            if (match) {
                const yaml = match[1];
                body = match[2].trim();
                yaml.split('\n').forEach(line => {
                    const idx = line.indexOf(':');
                    if (idx > -1) {
                        const key = line.slice(0, idx).trim();
                        const val = line.slice(idx + 1).trim().replace(/^["']|["']$/g, '');
                        meta[key] = val;
                    }
                });
            }
            return { title: meta.title || "Cím nélkül", date: meta.date || "", body: body };
        }

        function datumFormazas(dateStr) {
            if (!dateStr) return "";
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return dateStr;
            return d.toLocaleDateString('hu-HU', { year: 'numeric', month: 'long', day: 'numeric' });
        }

        function stripMarkdown(md) {
            return md.replace(/[#*_`~\[\]]/g, '').trim();
        }

        function kepKereso(body) {
            const match = body.match(/!\[.*?\]\((.*?)\)/);
            if (!match) return null;
            let url = match[1];
            if (url.startsWith('/images/')) url = url.substring(1);
            return url;
        }

        async function betoltes() {
            const repo = "bik-hu/bik-weboldal";
            const kontener = document.getElementById('osszes-kozlemeny');
            try {
                const res = await fetch(`https://api.github.com/repos/${repo}/contents/_posts/kozlemenyek`);
                if (res.ok) {
                    const files = await res.json();
                    const postPromises = files.map(async f => {
                        const fRes = await fetch(f.download_url);
                        const text = await fRes.text();
                        return { fileName: f.name, data: parseMarkdownFile(text) };
                    });
                    let posztok = await Promise.all(postPromises);
                    posztok.sort((a, b) => new Date(b.data.date || 0) - new Date(a.data.date || 0));

                    if (posztok.length > 0) {
                        kontener.innerHTML = "";
                        posztok.forEach(item => {
                            const post = item.data;
                            const kepUrl = kepKereso(post.body);
                            const tisztaBody = post.body.replace(/!\[.*?\]\(.*?\)/g, '');
                            const kivonat = stripMarkdown(tisztaBody).substring(0, 180) + "...";
                            const kepHtml = kepUrl ? `<div class="mb-4 h-56 w-full overflow-hidden rounded-md bg-gray-100"><img src="${kepUrl}" alt="${post.title}" class="w-full h-full object-cover"></div>` : '';

                            kontener.innerHTML += `
                                <article class="rounded-lg p-6 border border-gray-200 hover:border-[#1b3223] transition bg-white shadow-sm flex flex-col">
                                    ${kepHtml}
                                    ${post.date ? `<span class="text-xs text-[#1b3223] font-bold uppercase tracking-wider">${datumFormazas(post.date)}</span>` : ''}
                                    <h2 class="text-2xl font-bold text-[#1b3223] mt-1 mb-3">${post.title}</h2>
                                    <p class="text-gray-600 mb-6 leading-relaxed">${kivonat}</p>
                                    <a href="/cikk?fajl=${item.fileName}" class="inline-block bg-[#1b3223] text-white text-sm font-bold px-4 py-2 rounded hover:bg-[#284a34] transition text-center self-start">
                                        Tovább olvasom &rarr;
                                    </a>
                                </article>
                            `;
                        });
                    }
                }
            } catch (err) {}
        }
        betoltes();
    </script>
</body>
</html>
