<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Összes Közlemény - Bethlen István Kör</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Montserrat', sans-serif; }</style>
</head>
<body class="bg-white text-gray-900 flex flex-col min-h-screen">
    
    <!-- Navigáció -->
    <nav class="p-6 flex justify-between items-center border-b border-gray-100 bg-white sticky top-0 z-40">
        <a href="index.html" class="flex items-center space-x-3 hover:opacity-80 transition">
            <img src="logo2.png" alt="Logó" class="h-10 w-auto">
        </a>
        <div class="flex gap-6">
            <a href="index.html" class="text-gray-600 hover:text-[#1b3223] font-semibold">Főoldal</a>
            <a href="kozlemenyek.html" class="text-[#1b3223] font-bold border-b-2 border-[#1b3223]">Közlemények</a>
            <a href="esemenyek.html" class="text-gray-600 hover:text-[#1b3223] font-semibold">Események</a>
            <a href="kapcsolat.html" class="text-gray-600 hover:text-[#1b3223] font-semibold">Kapcsolat</a>
        </div>
    </nav>

    <!-- Tartalom -->
    <main class="py-16 px-6 max-w-4xl mx-auto flex-grow w-full">
        <h1 class="text-4xl font-bold text-[#1b3223] mb-10 border-b-2 border-[#1b3223] pb-3">Összes Közlemény</h1>
        <div id="osszes-kozlemeny" class="space-y-8">
            <p class="text-gray-500 italic">Közlemények betöltése...</p>
        </div>
    </main>

    <!-- Lábjegyzet -->
    <footer class="bg-[#1b3223] text-white py-8 text-center text-sm">
        <p>&copy; 2026 Bethlen István Kör. Minden jog fenntartva.</p>
    </footer>

    <script>
        function parseMarkdownFile(raw) {
            const match = raw.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/);
            let meta = {};
            let body = raw;
            if (match) {
                const yaml = match[1];
                body = match[2].trim();
                yaml.split('\n').forEach(line => {
                    const idx = line.indexOf(':');
                    if (idx > -1) {
                        const key = line.slice(0, idx).trim();
                        const val = line.slice(idx + 1).trim().replace(/^["']|["']$/g, '');
                        meta[key] = val;
                    }
                });
            }
            return { title: meta.title || "Cím nélkül", date: meta.date || "", body: body };
        }

        function datumFormazas(dateStr) {
            if (!dateStr) return "";
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return dateStr;
            return d.toLocaleDateString('hu-HU', { year: 'numeric', month: 'long', day: 'numeric' });
        }

        function stripMarkdown(md) {
            return md.replace(/[#*_`~\[\]]/g, '').trim();
        }

        function kepKereso(body) {
            const match = body.match(/!\[.*?\]\((.*?)\)/);
            if (!match) return null;
            let url = match[1];
            if (url.startsWith('/images/')) url = url.substring(1);
            return url;
        }

        async function osszesBetoltese() {
            const repo = "bik-hu/bik-weboldal";
            const kontener = document.getElementById('osszes-kozlemeny');
            try {
                const res = await fetch(`https://api.github.com/repos/${repo}/contents/_posts/kozlemenyek`);
                if (res.ok) {
                    const files = await res.json();
                    const promises = files.map(async f => {
                        const fRes = await fetch(f.download_url);
                        const text = await fRes.text();
                        return { fileName: f.name, data: parseMarkdownFile(text) };
                    });
                    let posztok = await Promise.all(promises);
                    posztok.sort((a, b) => new Date(b.data.date || 0) - new Date(a.data.date || 0));

                    if (posztok.length > 0) {
                        kontener.innerHTML = "";
                        posztok.forEach(item => {
                            const post = item.data;
                            const kepUrl = kepKereso(post.body);
                            const tisztaBody = post.body.replace(/!\[.*?\]\(.*?\)/g, '');
                            const kivonat = stripMarkdown(tisztaBody).substring(0, 150) + "...";
                            const kepHtml = kepUrl ? `<div class="mb-4 h-56 w-full overflow-hidden rounded-md bg-gray-100"><img src="${kepUrl}" alt="${post.title}" class="w-full h-full object-cover"></div>` : '';

                            kontener.innerHTML += `
                                <article class="rounded-lg p-6 border border-gray-200 bg-white shadow-sm">
                                    ${kepHtml}
                                    ${post.date ? `<span class="text-xs text-[#1b3223] font-bold uppercase tracking-wider">${datumFormazas(post.date)}</span>` : ''}
                                    <h2 class="text-2xl font-bold text-[#1b3223] mt-1 mb-3">${post.title}</h2>
                                    <p class="text-gray-600 mb-4 leading-relaxed">${kivonat}</p>
                                    <a href="cikk.html?fajl=${item.fileName}" class="text-[#1b3223] font-bold hover:underline inline-flex items-center gap-1">Tovább olvasom &rarr;</a>
                                </article>
                            `;
                        });
                    } else {
                        kontener.innerHTML = "<p class='text-gray-500'>Nincsenek közlemények.</p>";
                    }
                }
            } catch (err) {
                kontener.innerHTML = "<p class='text-red-500'>Hiba történt a betöltés során.</p>";
            }
        }
        osszesBetoltese();
    </script>
</body>
</html>
